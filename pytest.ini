[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# I test marcati `slow` richiedono la rete (clone git reali) o il download del
# modello TimesFM. Sono esclusi di default: `pytest` deve restare eseguibile
# offline e in pochi secondi. Per eseguirli: `pytest -m slow` (l'opzione da riga
# di comando sovrascrive quella dell'ini).
markers =
    slow: richiede rete o il download del modello TimesFM
addopts = -m "not slow"
